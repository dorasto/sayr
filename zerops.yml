# see https://docs.zerops.io/zerops-yml/specification for full reference
zerops:
  # ===============================
  # MARKETING (landing, TanStack Start / Node SSR)
  # ===============================
  - setup: marketing
    build:
      base: nodejs@22
      prepareCommands:
        # corepack ships with Node.js 22 — use it instead of npm install -g pnpm
        - corepack enable && corepack prepare pnpm@latest --activate
      buildCommands:
        - pnpm i
        - pnpm -F landing zerops:build
      deployFiles:
        # Strip apps/landing/ prefix so .output/ lands at container root
        - apps/landing/~.output
        - apps/landing/~package.json
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        HOST: 0.0.0.0
      start: node .output/server/index.mjs

  # ===============================
  # BACKEND (Hono on Bun)
  # ===============================
  - setup: backend
    build:
      base: bun@latest
      os: ubuntu
      prepareCommands:
        # Use corepack for pnpm
        - corepack enable && corepack prepare pnpm@latest --activate
      buildCommands:
        # Prune the workspace down to backend + its dependency graph only
        # (same tool the CE Dockerfiles use for the ghcr.io images) so we
        # install/deploy just what this service needs instead of shipping
        # the whole monorepo's node_modules to every service.
        - bunx turbo prune backend
        - cd out && pnpm install
        - cd out && pnpm -F backend zerops:build
      deployFiles:
        # compiled backend bundle -> dist/
        - out/apps/backend/~dist
        # migration runner (compiled standalone JS) -> migrate.js
        - out/packages/database/~migrate.js
        # SQL migration files -> drizzle/
        - out/packages/database/~drizzle
        # startup script -> start.sh
        - out/apps/backend/~start.sh
        # package.json -> package.json
        - out/apps/backend/~package.json
        # pruned node_modules (backend's dependency subset only)
        - out/~node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 5468
          path: /api/health
    run:
      base: bun@latest
      os: ubuntu
      ports:
        - port: 5468
          httpSupport: true
      initCommands:
        # jsdom's bundled code resolves __dirname to the build-time path for
        # its CSS assets. The build now runs from /build/source/out (pruned
        # workspace), not /build/source directly, so the baked-in path is
        # /build/source/out/node_modules/... — symlink that exact path to
        # where node_modules actually lives at runtime.
        - sudo mkdir -p /build/source/out && sudo ln -sf /var/www/node_modules /build/source/out/node_modules
      start: chmod +x start.sh && sh start.sh
      healthCheck:
        httpGet:
          port: 5468
          path: /api/health

  # ===============================
  # START (TanStack Start / Node SSR)
  # ===============================
  - setup: start
    build:
      base: nodejs@22
      envVariables:
        NODE_OPTIONS: --max-old-space-size=8192
        # These VITE_* / define vars are baked into the bundle at build time (see vite.config.ts)
        APP_ENV: production
        SAYR_EDITION: cloud
        # PostHog: VITE_PUBLIC_POSTHOG_KEY, VITE_PUBLIC_POSTHOG_HOST, POSTHOG_CLI_TOKEN, and
        # POSTHOG_CLI_ENV_ID are defined as project-level custom environment variables in Zerops
        # and are injected automatically — do NOT redeclare them here or Zerops will create a
        # recursive self-reference loop.
      prepareCommands:
        # corepack ships with Node.js 22 — use it instead of npm install -g pnpm
        - corepack enable && corepack prepare pnpm@latest --activate
      buildCommands:
        - pnpm i
        - pnpm -F start zerops:build
      deployFiles:
        # Strip apps/start/ prefix so .output/ lands at container root
        - apps/start/~.output
        - apps/start/~package.json
        # Startup script: placeholder replacement + Nitro manifest size patching
        - apps/start/~zerops-start.sh
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      initCommands:
        # Run placeholder replacement + Nitro asset manifest size patching
        - chmod +x zerops-start.sh && sh zerops-start.sh
      start: node .output/server/index.mjs

  # ===============================
  # WORKER (Bun background job processor)
  # ===============================
  - setup: workermain
    build:
      base: bun@latest
      os: ubuntu
      prepareCommands:
        # Use corepack for pnpm
        - corepack enable && corepack prepare pnpm@latest --activate
      buildCommands:
        - pnpm i
        - pnpm -F worker zerops:build
      deployFiles:
        # Strip apps/worker/ prefix so dist/ lands at container root
        - apps/worker/~dist
        - apps/worker/~package.json
        - node_modules
    run:
      base: bun@latest
      os: ubuntu
      ports:
        - port: 8080
          httpSupport: true
      healthCheck:
        httpGet:
          port: 8080
          path: /
      start: bun run dist/index.js main

  - setup: workergithub
    build:
      base: bun@latest
      os: ubuntu
      prepareCommands:
        # Use corepack for pnpm
        - corepack enable && corepack prepare pnpm@latest --activate
      buildCommands:
        - pnpm i
        - pnpm -F worker zerops:build
      deployFiles:
        # Strip apps/worker/ prefix so dist/ lands at container root
        - apps/worker/~dist
        - apps/worker/~package.json
        - node_modules
    run:
      base: bun@latest
      os: ubuntu
      ports:
        - port: 8080
          httpSupport: true
      healthCheck:
        httpGet:
          port: 8080
          path: /
      start: bun run dist/index.js github

  - setup: integrations
    build:
      base: bun@latest
      os: ubuntu
      prepareCommands:
        # Use corepack for pnpm
        - corepack enable && corepack prepare pnpm@latest --activate
      buildCommands:
        - pnpm i
        - pnpm -F integrations build:all
      deployFiles:
        # Strip integrations/ prefix so dist/ lands at container root
        - integrations/~dist
        - integrations/~services
        - node_modules
    run:
      base: bun@latest
      os: ubuntu
      ports:
        - port: 8080
          httpSupport: true
      healthCheck:
        httpGet:
          port: 8080
          path: /
      start: bun run dist/index.js
