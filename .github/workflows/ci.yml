name: CI

# Runs on every PR — this is the trust signal for "no failing CI, safe to
# merge without manual testing" (including Renovate's own PRs). No secrets
# are used anywhere in this workflow: build/test genuinely don't need any
# (verified against a completely clean checkout, no .env files at all —
# every place that reads an env var here falls back to a safe default), and
# bot-triggered PRs don't get repository secrets from GitHub Actions anyway.
on:
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/marketing is being retired in favor of apps/landing and isn't
      # built/deployed — apps/landing has a pre-existing shiki/rolldown WASM
      # build failure unrelated to any particular PR (confirmed against a
      # clean checkout). Neither should block every other PR in the repo
      # until someone gets round to fixing/removing them.
      - run: pnpm turbo build --filter='!marketing' --filter='!landing' --continue

  # Fails if the Drizzle schema and the committed migrations disagree: a schema
  # change committed without its migration, or a drizzle-kit/drizzle-orm bump
  # that changes the migration/snapshot format. Needs no database or env.
  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @repo/database generate
      - name: Check for uncommitted migrations
        run: |
          if [ -n "$(git status --porcelain -- packages/database/drizzle)" ]; then
            git status --short -- packages/database/drizzle
            echo "::error::drizzle-kit generate produced changes. Run 'pnpm -F @repo/database generate' and commit the migration."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test --continue

  # apps/marketing is excluded for the same reason as in Build (being
  # retired, ~5k pre-existing issues). Pre-existing violations whose fix
  # would change runtime behaviour are suppressed inline with a
  # "behaviour-changing fix deferred" reason — grep for that to find them.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint --filter='!marketing' --continue

  # Only packages with a check-types script are checked. Packages that still
  # have pre-existing type errors (apps/start, apps/backend, apps/worker,
  # packages/database, packages/auth, packages/util, packages/storage,
  # packages/cli, packages/create-integration, integrations/services/discordbot)
  # get their script once they're clean.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo check-types --continue
