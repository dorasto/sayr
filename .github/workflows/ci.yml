name: CI

# Runs on every PR — this is the trust signal for "no failing CI, safe to
# merge without manual testing" (including Renovate's own PRs). No secrets
# are used anywhere in this workflow: build/test genuinely don't need any
# (verified against a completely clean checkout, no .env files at all —
# every place that reads an env var here falls back to a safe default), and
# bot-triggered PRs don't get repository secrets from GitHub Actions anyway.
on:
  pull_request:
    branches:
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/marketing is being retired in favor of apps/landing and isn't
      # built/deployed — apps/landing has a pre-existing shiki/rolldown WASM
      # build failure unrelated to any particular PR (confirmed against a
      # clean checkout). Neither should block every other PR in the repo
      # until someone gets round to fixing/removing them.
      - run: pnpm turbo build --filter='!marketing' --filter='!landing'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test

  # Informational only — not required for merge. This repo has a pre-existing
  # lint/type-error backlog from before this workflow existed, so treating
  # either as a hard gate right now would block every future PR, not just
  # ones that introduce new problems. Still runs and reports on every PR so
  # backlog work is visible; promote to required once each is clean.
  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  typecheck:
    name: Typecheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo check-types
