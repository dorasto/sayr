# Deploys the cloud (sayr.io) services to Zerops.
#
# Replaces Zerops' own "new tag" git-integration webhook — that trigger fired
# on every tag (including cli-v* CLI releases, which never touch these
# services) and gave no build visibility outside the Zerops dashboard. This
# workflow only reacts to website release tags (v1.2.3, not cli-v1.2.3 —
# the pattern below requires the tag to start with a literal "v" followed by
# a digit, so cli-v* tags never match) and streams the Zerops build/deploy
# log straight into the job output.
#
# The push.tags trigger only fires for a tag pushed with real user
# credentials — release-on-merge.yml pushes its v* tag using the default
# GITHUB_TOKEN, and GitHub deliberately suppresses downstream workflow
# triggers from GITHUB_TOKEN-authored pushes (anti-recursion guard), so that
# tag alone never reaches this workflow. The workflow_call trigger below is
# what actually fires on a real release — release-on-merge.yml invokes this
# workflow directly as a job, the same way it already does for
# build-and-deploy.yml.
#
# Separate from build-and-deploy.yml, which builds the CE/self-host Docker
# images for ghcr.io and has no relation to the Zerops project.
#
# Requires the "Stop automatic build trigger" switch flipped in each
# service's Build/Deploy/Run Pipeline settings in the Zerops dashboard so the
# webhook and this workflow don't both fire on the same tag.
#
# Required secrets:
#   ZEROPS_TOKEN                  - Zerops dashboard -> Settings -> Access Token Management
#   ZEROPS_SERVICE_ID_MARKETING   - service detail -> three-dot menu -> Copy Service ID
#   ZEROPS_SERVICE_ID_BACKEND
#   ZEROPS_SERVICE_ID_START
#   ZEROPS_SERVICE_ID_WORKERMAIN
#   ZEROPS_SERVICE_ID_WORKERGITHUB
#   ZEROPS_SERVICE_ID_INTEGRATIONS
#   ZEROPS_SERVICE_ID_DB          - the PostgreSQL service (sayrdb)
# Service IDs go through secrets (not hardcoded) per Zerops' own CI/CD
# reference pattern, even though the ID alone can't authenticate anything —
# this repo is public, so no reason to publish the project's service
# topology when a secret costs nothing extra.
#
# Database backup: before any service that talks to the database is deployed,
# the backup-db job asks Zerops for an on-demand backup of the PostgreSQL
# service and waits until it exists. The backend runs migrations when its
# new container starts (apps/backend/start.sh), so this is the last point
# before the schema can change. If the backup fails, nothing that touches the
# database is deployed. Backups are tagged `pre-deploy` plus the release
# version (dots become dashes, e.g. v0-8-1) and the run ID, and the job
# summary prints the exact backup name.
#
# Restoring: Zerops dashboard -> sayrdb -> Backups -> download the backup
# tagged with the release, then restore it with pg_restore/psql (the zip holds
# a pg_dump per schema). See https://docs.zerops.io/postgresql/how-to/backup
#
# Note: migrations also run whenever a backend container restarts or scales
# up, not only on deploys. Those runs normally find nothing new to apply.

name: Deploy to Zerops

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Invoked directly by release-on-merge.yml right after it tags a release —
  # see the header comment above for why the tag push alone can't do this.
  workflow_call:
    inputs:
      version:
        description: "Release version being deployed (used to tag the database backup)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      marketing:
        description: "marketing (landing site)"
        type: boolean
        default: true
      backend:
        description: "backend"
        type: boolean
        default: true
      start:
        description: "start (admin/public UI)"
        type: boolean
        default: true
      workermain:
        description: "workermain (queue processor)"
        type: boolean
        default: true
      workergithub:
        description: "workergithub (GitHub webhook processor)"
        type: boolean
        default: true
      integrations:
        description: "integrations"
        type: boolean
        default: true
      skip_backup:
        description: "Skip the pre-deploy database backup (emergency hotfix only, e.g. if the Zerops backup API is down)"
        type: boolean
        default: false

# One deploy run at a time; let an in-flight deploy finish rather than
# cancel it mid-way.
concurrency:
  group: zerops-deploy
  cancel-in-progress: false

permissions:
  contents: read

# Six independent jobs, no `needs:` between them, so GitHub Actions fans them
# out and runs all selected services in parallel (same as the matrix build
# in build-and-deploy.yml) instead of one after another in a single job.
jobs:
  backup-db:
    name: Back up database
    # Runs whenever at least one database-touching service is being deployed
    # (everything except marketing), unless explicitly skipped on a manual run.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (!inputs.skip_backup && (inputs.backend || inputs.start || inputs.workermain || inputs.workergithub || inputs.integrations))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZEROPS_API: https://api.app-prg1.zerops.io/api/rest/public
      ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
      DB_SERVICE_ID: ${{ secrets.ZEROPS_SERVICE_ID_DB }}
      VERSION: ${{ inputs.version || github.ref_name }}
      RUN_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Request backup
        run: |
          set -euo pipefail
          if [ -z "$DB_SERVICE_ID" ]; then
            echo "::error::ZEROPS_SERVICE_ID_DB secret is not set"
            exit 1
          fi
          # Tags: letters, numbers and :-_ only, max 24 chars.
          VERSION_TAG=$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9:_-' '-' | cut -c1-24)
          TAGS=$(jq -cn --arg v "$VERSION_TAG" --arg r "$RUN_TAG" '["pre-deploy", $r] + (if ($v | test("^v[0-9]")) then [$v] else [] end)')
          echo "Tags: $TAGS"
          curl -sSf -X POST \
            -H "Authorization: Bearer $ZEROPS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tags\": $TAGS}" \
            "$ZEROPS_API/service-stack/$DB_SERVICE_ID/backup"
          echo

      - name: Wait for backup to finish
        run: |
          set -euo pipefail
          # The backup runs asynchronously; it's done once a file carrying
          # this run's unique tag shows up in the service's backup list.
          for i in $(seq 1 60); do
            NAME=$(curl -sSf -H "Authorization: Bearer $ZEROPS_TOKEN" \
              "$ZEROPS_API/service-stack/$DB_SERVICE_ID/backup" \
              | jq -r --arg t "$RUN_TAG" '[.files[] | select((.metadata.tags // []) | index($t))] | first | .name // empty')
            if [ -n "$NAME" ]; then
              echo "Backup ready: $NAME"
              {
                echo "### Database backup"
                echo "Pre-deploy backup of sayrdb: \`$NAME\` (tags: pre-deploy, $RUN_TAG, version $VERSION)."
                echo "Restore from Zerops dashboard -> sayrdb -> Backups."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backup did not appear within 10 minutes; not deploying."
          exit 1

  marketing:
    name: Deploy marketing
    if: github.event_name != 'workflow_dispatch' || inputs.marketing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID_MARKETING }}

  backend:
    name: Deploy backend
    needs: backup-db
    # Deploy only once the backup succeeded (or was deliberately skipped).
    if: >-
      !cancelled() &&
      (needs.backup-db.result == 'success' || needs.backup-db.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID_BACKEND }}

  start:
    name: Deploy start
    needs: backup-db
    # Deploy only once the backup succeeded (or was deliberately skipped).
    if: >-
      !cancelled() &&
      (needs.backup-db.result == 'success' || needs.backup-db.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID_START }}

  workermain:
    name: Deploy workermain
    needs: backup-db
    # Deploy only once the backup succeeded (or was deliberately skipped).
    if: >-
      !cancelled() &&
      (needs.backup-db.result == 'success' || needs.backup-db.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.workermain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID_WORKERMAIN }}

  workergithub:
    name: Deploy workergithub
    needs: backup-db
    # Deploy only once the backup succeeded (or was deliberately skipped).
    if: >-
      !cancelled() &&
      (needs.backup-db.result == 'success' || needs.backup-db.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.workergithub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID_WORKERGITHUB }}

  integrations:
    name: Deploy integrations
    needs: backup-db
    # Deploy only once the backup succeeded (or was deliberately skipped).
    if: >-
      !cancelled() &&
      (needs.backup-db.result == 'success' || needs.backup-db.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.integrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: zeropsio/actions@19329d7d7ecaad2c382fb30ea6e52aaa15ec1f20 # v1.0.2
        with:
          access-token: ${{ secrets.ZEROPS_TOKEN }}
          service-id: ${{ secrets.ZEROPS_SERVICE_ID_INTEGRATIONS }}
