name: PR Label Enforcement

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
    branches:
      - main

jobs:
  check-release-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for release label
        id: check-label
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels: $PR_LABELS"

          HAS_RELEASE_LABEL=false
          BUMP_TYPE=""
          NEXT_VERSION=""

          if echo "$PR_LABELS" | grep -qE '"release:major"'; then
            HAS_RELEASE_LABEL=true
            BUMP_TYPE="major"
          elif echo "$PR_LABELS" | grep -qE '"release:minor"'; then
            HAS_RELEASE_LABEL=true
            BUMP_TYPE="minor"
          elif echo "$PR_LABELS" | grep -qE '"release:patch"'; then
            HAS_RELEASE_LABEL=true
            BUMP_TYPE="patch"
          elif echo "$PR_LABELS" | grep -qE '"release:skip"'; then
            HAS_RELEASE_LABEL=true
            BUMP_TYPE="skip"
          fi

          echo "has_label=$HAS_RELEASE_LABEL" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          if [ "$HAS_RELEASE_LABEL" = "true" ] && [ "$BUMP_TYPE" != "skip" ] && [ -n "$BUMP_TYPE" ]; then
            LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            LATEST_TAG=${LATEST_TAG:-v0.0.0}
            CURRENT_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            if [ "$BUMP_TYPE" = "major" ]; then
              NEXT_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$BUMP_TYPE" = "minor" ]; then
              NEXT_VERSION="${MAJOR}.$((MINOR + 1)).0"
            elif [ "$BUMP_TYPE" = "patch" ]; then
              NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi

            echo "next_version=v${NEXT_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "next_version=" >> $GITHUB_OUTPUT
          fi

      - name: Check CLI changes and compute next CLI version
        id: check-cli
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Only relevant if this PR touches packages/cli/** — mirrors the
          # path filter on publish-cli.yml, which is what actually publishes
          # once this merges. This step only previews that outcome; it never
          # bumps or publishes anything itself.
          if ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^packages/cli/'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "Labels: $PR_LABELS"

          # Same default-patch/override logic as publish-cli.yml's detect job —
          # no label at all defaults to a patch release.
          BUMP_TYPE="patch"
          if echo "$PR_LABELS" | grep -q '"cli-release:major"'; then
            BUMP_TYPE="major"
          elif echo "$PR_LABELS" | grep -q '"cli-release:minor"'; then
            BUMP_TYPE="minor"
          elif echo "$PR_LABELS" | grep -q '"cli-release:skip"'; then
            BUMP_TYPE="skip"
          fi
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

          if [ "$BUMP_TYPE" = "skip" ]; then
            echo "next_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same tag+npm cross-check as publish-cli.yml, so this preview can't
          # drift from what the post-merge workflow will actually compute.
          LATEST_TAG=$(git tag --list 'cli-v*' --sort=-v:refname | head -n 1)
          LATEST_TAG=${LATEST_TAG:-cli-v0.0.0}
          TAG_VERSION=${LATEST_TAG#cli-v}

          NPM_VERSION=$(npm view @sayrio/cli version 2>/dev/null || echo "0.0.0")
          CURRENT_VERSION=$(printf '%s\n%s\n' "$TAG_VERSION" "$NPM_VERSION" | sort -V | tail -n 1)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          echo "next_version=cli-v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR - Missing Label
        if: steps.check-label.outputs.has_label == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes('Release Label Required') || comment.body.includes('Release Label Added'))
            );

            let body = `## Release Label Required

            This PR needs a release label to indicate the type of change:

            - \`release:major\` - Breaking changes (bumps major version, e.g., 1.0.0 -> 2.0.0)
            - \`release:minor\` - New features (bumps minor version, e.g., 1.0.0 -> 1.1.0)
            - \`release:patch\` - Bug fixes (bumps patch version, e.g., 1.0.0 -> 1.0.1)
            - \`release:skip\` - No release needed (docs, tests, CI changes)

            Please add **exactly one** release label before merging.`;

            const cliChanged = '${{ steps.check-cli.outputs.changed }}' === 'true';
            const cliBumpType = '${{ steps.check-cli.outputs.bump_type }}';
            const cliNextVersion = '${{ steps.check-cli.outputs.next_version }}';

            if (cliChanged) {
              if (cliBumpType === 'skip') {
                body += '\n\n---\n\nThis PR also touches `packages/cli/**`. You added `cli-release:skip` — no CLI version bump will occur when this PR is merged.';
              } else if (cliNextVersion) {
                const note = cliBumpType === 'patch' ? ' (default patch bump — add `cli-release:major`, `cli-release:minor`, or `cli-release:skip` to override)' : '';
                body += `\n\n---\n\nThis PR also touches \`packages/cli/**\`. The CLI will be published as **${cliNextVersion}**${note} once merged.`;
              }
            }

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Comment on PR - Label Found
        if: steps.check-label.outputs.has_label == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes('Release Label Required') || comment.body.includes('Release Label Added'))
            );

            const bumpType = '${{ steps.check-label.outputs.bump_type }}';
            const nextVersion = '${{ steps.check-label.outputs.next_version }}';

            let body = '';
            if (bumpType === 'skip') {
              body = '## Release Label Added\n\nYou added `release:skip` - no version bump will occur when this PR is merged.';
            } else if (nextVersion) {
              body = `## Release Label Added\n\nYou added \`release:${bumpType}\`. The next version once merged will be **${nextVersion}**.`;
            } else {
              body = '## Release Label Added\n\nYou added a release label.';
            }

            const cliChanged = '${{ steps.check-cli.outputs.changed }}' === 'true';
            const cliBumpType = '${{ steps.check-cli.outputs.bump_type }}';
            const cliNextVersion = '${{ steps.check-cli.outputs.next_version }}';

            if (cliChanged) {
              if (cliBumpType === 'skip') {
                body += '\n\n---\n\nThis PR also touches `packages/cli/**`. You added `cli-release:skip` — no CLI version bump will occur when this PR is merged.';
              } else if (cliNextVersion) {
                const note = cliBumpType === 'patch' ? ' (default patch bump — add `cli-release:major`, `cli-release:minor`, or `cli-release:skip` to override)' : '';
                body += `\n\n---\n\nThis PR also touches \`packages/cli/**\`. The CLI will be published as **${cliNextVersion}**${note} once merged.`;
              }
            }

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Require release label
        if: steps.check-label.outputs.has_label == 'false'
        run: |
          echo "::error::This PR requires a release label (release:major, release:minor, release:patch, or release:skip)"
          exit 1
